.fchip { font: inherit; font-size: .8rem; white-space: nowrap; flex: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer; }

.fkind { flex: none; font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-left: 8px; }
#clear { flex: none; white-space: nowrap; }
@media (max-width: 700px) { .fbar { flex-wrap: wrap; } #q { flex: 1 1 160px; } .fchips { order: 3; flex-basis: 100%; } }
/* Drag to ship */
.card[draggable="true"] { cursor: grab; }
.card.asked { border-style: dashed; border-left-style: solid; cursor: default; }
.card.asked .why { color: var(--c); font-weight: 600; }
section.target { outline: 2px dashed color-mix(in srgb, var(--c) 55%, transparent); outline-offset: -2px; }
section.over { outline: 3px solid var(--c); outline-offset: -3px; background: color-mix(in srgb, var(--c) 22%, transparent); }
.card .issue { color: var(--run); font-weight: 600; text-decoration: none; font-variant-numeric: tabular-nums; }
.card .issue:hover { text-decoration: underline; }
.card .issue:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
/* Subagents strip: above the tabs, so the same strip shows on every tab */
:root { --mono: ui-monospace, "Cascadia Code", Consolas, monospace; }
#sheet code { font-family: var(--mono); font-size: .88em; background: color-mix(in srgb, var(--fg) 8%, transparent); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.agents { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; background: var(--bg); scrollbar-width: thin; }
.agents .lead { flex: none; display: flex; align-items: center; padding: 0 14px; font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-right: 1px solid var(--line); }
.agent { flex: 1 0 150px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 9px; align-items: center; padding: 7px 14px; }
.agent + .agent { border-left: 1px solid var(--line); }
.agent .dot { grid-row: 1 / 3; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .74rem; font-weight: 700; border: 2px solid var(--line); color: var(--muted); box-sizing: border-box; }
.agent b { font-size: .86rem; font-weight: 600; white-space: nowrap; }
.agent .r { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent.ok .dot { background: var(--ship); border-color: var(--ship); color: var(--surface); }
.agent.ok .r { color: var(--ship); }
.agent.warn { background: color-mix(in srgb, var(--test) 9%, transparent); }
.agent.warn .dot { border-color: var(--test); color: var(--test); }
.agent.warn .r { color: var(--test); font-weight: 600; }
.tab .badge { display: inline-block; margin-left: 6px; font-size: .7rem; font-weight: 700; background: var(--test); color: var(--surface); border-radius: 999px; padding: 0 7px; }
.qline { margin: 0; font-size: .95rem; line-height: 1.45; max-width: 100ch; overflow-wrap: anywhere; }
.qopt.rec { border-color: var(--ship); }
.testlinks { display: flex; flex-wrap: wrap; gap: 8px; }
.linkbtn.stack, .linkbtn.login { font-weight: 600; border-color: color-mix(in srgb, var(--run) 50%, var(--line)); }
.linkbtn.stack::before, .linkbtn.login::before { content: "↗ "; }
.qopt.chosen { border: 2px solid var(--ship); background: color-mix(in srgb, var(--ship) 12%, var(--surface)); }
.qopt.chosen:disabled, .plan .decn .qopt.chosen:disabled, .qbox .qopt.chosen:disabled { opacity: 1; color: var(--fg); }
.qopt .pick { color: var(--ship); font-weight: 700; font-size: .78rem; }
.chip.a { background: var(--ship); border-color: var(--ship); color: var(--surface); font-weight: 600; }
.qans { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; font-size: .9rem; font-weight: 500; }
.qans .linkbtn { padding: 2px 10px; font-size: .8rem; }
.qline.done { color: var(--muted); }
.plan .needs > h3 .q.a { background: var(--ship); }
.plan .sec.needs.settled { border-color: color-mix(in srgb, var(--ship) 45%, var(--line)); background: color-mix(in srgb, var(--ship) 5%, var(--surface)); }
.plan .decn.answered { border-color: color-mix(in srgb, var(--ship) 55%, var(--line)); }
.plan .decn.answered .dnum { background: var(--ship); border-color: var(--ship); color: var(--surface); }
.qopt .recm { color: var(--ship); font-weight: 600; font-size: .78rem; }

/* Plan tab: goal, picture, decisions, ship order, risk and undo, done when, folds */
.pane.plan { gap: 30px; }
.plan .partno { font-variant-numeric: tabular-nums; font-weight: 700; font-size: .72rem; border-radius: 4px; padding: 1px 6px; color: var(--surface); background: var(--p, var(--done)); white-space: nowrap; }
.plan .goal { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 32px; align-items: center; flex: none; }
.plan .goal p { font-family: var(--display); font-size: clamp(1.25rem, 2.3vw, 1.8rem); line-height: 1.25; font-weight: 600; margin: 0; max-width: 34ch; text-wrap: balance; overflow-wrap: anywhere; }
.plan .goal p em { font-style: normal; color: var(--ship); }
.plan .goal p s { text-decoration-color: var(--stuck); text-decoration-thickness: 2px; color: var(--muted); }
.plan .stats { display: flex; flex-wrap: wrap; gap: 10px; }
.plan .stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; text-align: center; min-width: 86px; }
.plan .stat b { display: block; font-family: var(--display); font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.plan .stat span { font-size: .76rem; color: var(--muted); }
.plan .stat.you { border-color: var(--test); background: color-mix(in srgb, var(--test) 10%, transparent); }
.plan .stat.you b { color: var(--test); }
.plan .flow { display: flex; flex-direction: column; gap: 10px; }
.plan .lane { --k: var(--stuck); display: grid; grid-template-columns: var(--lane); align-items: stretch; border: 1px solid var(--line); border-left: 4px solid var(--k); border-radius: 8px; padding: 12px 14px; background: color-mix(in srgb, var(--k) 5%, transparent); }
.plan .lane.after { --k: var(--ship); }
.plan .lane .when { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 10px; }
.plan .lane .when b { font-family: var(--display); font-size: 1.05rem; }
.plan .lane .when span { font-size: .74rem; font-weight: 600; color: var(--k); }
.plan .node { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow-wrap: anywhere; }
.plan .node .who { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.plan .node b { font-size: .95rem; font-weight: 600; line-height: 1.3; }
.plan .node .s { font-size: .8rem; color: var(--muted); line-height: 1.35; }
.plan .node .gate { margin-top: 5px; font-size: .78rem; line-height: 1.35; border-radius: 6px; padding: 4px 8px; display: flex; gap: 6px; align-items: baseline; }
.plan .node .gate.no { border: 1px dashed var(--stuck); color: var(--stuck); }
.plan .node .gate.lock { border: 1px dashed var(--run); color: var(--run); }
.plan .lane.today .node.hot { border-color: var(--stuck); }
.plan .lane.after .node.hot { border-color: var(--ship); }
.plan .arrow { display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 5px; padding: 0 6px; color: var(--k); min-width: 0; }
.plan .arrow span { font-size: .76rem; font-weight: 600; text-align: center; line-height: 1.25; }
.plan .arrow i { display: block; height: 2px; background: currentColor; position: relative; margin-right: 6px; }
.plan .arrow i::after { content: ""; position: absolute; right: -6px; top: -4px; border: 5px solid transparent; border-left: 7px solid currentColor; border-right: 0; }
.plan .sec.needs { border: 1px solid color-mix(in srgb, var(--test) 55%, var(--line)); border-radius: 10px; background: color-mix(in srgb, var(--test) 7%, var(--surface)); padding: 16px 18px 18px; gap: 14px; }
.plan .needs > h3 .q { font-family: var(--body); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: var(--test); color: var(--surface); border-radius: 4px; padding: 2px 8px; }
.plan .decs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 12px; }
.plan .decn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.plan .decn .dtop { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.plan .decn .dnum { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--test); color: var(--test); font-weight: 700; font-size: .8rem; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
.plan .decn .kind { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.plan .decn h4 { font-family: var(--display); font-size: 1.05rem; font-weight: 600; margin: 0; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.plan .decn ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: .86rem; line-height: 1.4; }
.plan .decn li { padding-left: 22px; position: relative; overflow-wrap: anywhere; }
.plan .decn li::before { content: "✓"; color: var(--ship); font-weight: 700; position: absolute; left: 0; }
.plan .decn li.x::before { content: "✕"; color: var(--stuck); }
.plan .decn .qopts { grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); max-width: none; }
.plan .decn .qopt { background: var(--bg); }
.plan .decn .qrow input { background: var(--bg); }
.plan .decn .said { font-size: .86rem; color: var(--muted); overflow-wrap: anywhere; }
.plan .decn .said:empty { display: none; }
.plan .decn :disabled { opacity: .55; cursor: default; }
.plan .order { display: flex; align-items: stretch; }
.plan .stop { position: relative; padding: 26px 8px 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 0; }
.plan .stop.now, .plan .stop.end { flex: 0 0 150px; }
.plan .stop::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--line); }
.plan .stop:first-child::before { left: 16px; }
.plan .stop:last-child::before { right: calc(100% - 16px); }
.plan .stop::after { content: ""; position: absolute; left: 8px; top: 1px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--k, var(--done)); box-sizing: border-box; }
.plan .stop.now { --k: var(--test); }
.plan .stop.now::after { background: var(--test); }
.plan .stop.end { --k: var(--ship); }
.plan .stop .t { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--k, var(--muted)); }
.plan .stop .h { font-family: var(--display); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.plan .stop .d { font-size: .82rem; color: var(--muted); line-height: 1.4; }
.plan .parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px; }
.plan .part { border: 1px solid var(--line); border-top: 3px solid var(--p); border-radius: 8px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 7px; background: var(--surface); min-width: 0; overflow-wrap: anywhere; }
.plan .part .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.plan .part .hd b { font-size: .95rem; font-weight: 600; }
.plan .part .hd .sz { margin-left: auto; font-size: .7rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.plan .part p { margin: 0; font-size: .84rem; line-height: 1.4; }
.plan .part .w { font-size: .76rem; color: var(--muted); }
.plan .prog { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 2px; }
.plan .prog span { font-size: .66rem; color: var(--muted); text-align: center; padding-top: 6px; border-top: 4px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan .prog .on { border-top-color: var(--ship); color: var(--ship); font-weight: 600; }
.plan .prog .next { border-top-color: var(--test); color: var(--test); font-weight: 600; }
.plan .two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
.plan .two.one { grid-template-columns: minmax(0, 1fr); max-width: 100ch; }
.plan .box { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.plan .box > h4 { margin: 0; padding: 9px 14px; font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--k); background: color-mix(in srgb, var(--k) 9%, transparent); border-bottom: 1px solid var(--line); }
.plan .box.risk { --k: var(--stuck); }
.plan .box.undo { --k: var(--run); }
.plan .row { display: grid; grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr); gap: 8px; padding: 9px 14px; font-size: .86rem; line-height: 1.4; align-items: start; overflow-wrap: anywhere; }
.plan .row + .row { border-top: 1px solid var(--line); }
.plan .row i { font-style: normal; color: var(--muted); text-align: center; }
.plan .row b { font-weight: 600; }
.plan .row .fix { color: var(--muted); }
.plan .box.undo .row { grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
.plan .box.undo .row .who { display: flex; flex-wrap: wrap; gap: 4px; }
.plan .box.undo .foot { padding: 9px 14px; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--line); margin-top: auto; }
.plan .done { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 0 18px; margin: 0; padding: 0; list-style: none; max-width: 130ch; }
.plan .done li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 9px; align-items: start; font-size: .9rem; line-height: 1.4; padding: 7px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.plan .done li::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); margin-top: 2px; box-sizing: border-box; font-size: .62rem; font-weight: 700; display: flex; align-items: center; justify-content: center; color: var(--surface); }
.plan .done li.met::before { content: "✓"; background: var(--ship); border-color: var(--ship); }
.plan .done li.unmet::before { content: "✕"; background: var(--stuck); border-color: var(--stuck); }
.plan .done small { display: block; color: var(--muted); font-size: .78rem; }
.plan .meter { flex: 1 1 140px; max-width: 220px; height: 6px; border-radius: 3px; background: var(--line); align-self: center; overflow: hidden; display: block; }
.plan .meter i { display: block; height: 100%; background: var(--ship); }
.plan .outs { display: flex; flex-wrap: wrap; gap: 8px; }
.plan .out { font-size: .84rem; border: 1px dashed var(--line); border-radius: 999px; padding: 4px 12px; color: var(--muted); }
.plan .out b { color: var(--fg); font-weight: 500; text-decoration: line-through; text-decoration-color: var(--muted); }
.plan .folds { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.plan .folds details + details { border-top: 1px solid var(--line); }
.plan .folds summary { cursor: pointer; padding: 11px 14px; font-size: .92rem; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; list-style: none; }
.plan .folds summary::-webkit-details-marker { display: none; }
.plan .folds summary::before { content: "▸"; color: var(--muted); }
.plan .folds details[open] > summary::before { content: "▾"; }
.plan .folds summary:focus-visible { outline: 2px solid var(--run); outline-offset: -2px; }
.plan .folds summary small { font-weight: 400; color: var(--muted); font-size: .82rem; }
.plan .folds .in { padding: 2px 16px 16px 36px; font-size: .92rem; line-height: 1.55; max-width: 92ch; display: flex; flex-direction: column; gap: 12px; }
.plan .folds ol, .plan .folds ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 7px; }
.plan .folds .prose { font-size: .95rem; }
.plan .decn .qopt.chosen:disabled { opacity: 1; }
/* Plan widgets (#1017) */
.plan .wgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 18px; }
.plan .wslot { grid-column: 1 / -1; min-width: 0; display: flex; flex-direction: column; gap: 30px; }
.plan .wslot.half { grid-column: auto; }
@media (max-width: 760px) { .plan .wslot.half { grid-column: 1 / -1; } }
.plan .wmd { display: flex; flex-direction: column; gap: 8px; font-size: .92rem; line-height: 1.55; max-width: 92ch; overflow-wrap: anywhere; }
.plan .wmd p, .plan .wmd h4, .plan .wmd h5, .plan .wmd h6 { margin: 0; }
.plan .wmd ul, .plan .wmd ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.plan .wmd blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.plan .wmd a { color: var(--run); }
.plan .wcall { --k: var(--run); display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; border: 1px solid color-mix(in srgb, var(--k) 45%, var(--line)); border-left: 4px solid var(--k); border-radius: 8px; padding: 12px 14px; background: color-mix(in srgb, var(--k) 7%, var(--surface)); }
.plan .wcall.warn { --k: var(--test); }
.plan .wcall.decision { --k: var(--plan); }
.plan .wcall .ic { width: 24px; height: 24px; border-radius: 50%; background: var(--k); color: var(--surface); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: .82rem; }
.plan .wcall > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.plan .wmetrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 10px; }
.plan .wmetric { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.plan .wmetric b { font-family: var(--display); font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.plan .wmetric span { font-size: .8rem; color: var(--muted); }
.plan .wmetric small { font-size: .74rem; color: var(--muted); }
.plan .wmetric.good b { color: var(--ship); } .plan .wmetric.bad b { color: var(--stuck); } .plan .wmetric.warn b { color: var(--test); }
.plan .wtable { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.plan .wtable table { border-collapse: collapse; width: 100%; font-size: .86rem; }
.plan .wtable caption { text-align: left; padding: 8px 12px; color: var(--muted); font-size: .8rem; }
.plan .wtable th, .plan .wtable td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.plan .wtable th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: color-mix(in srgb, var(--line) 30%, transparent); }
.plan .wtable tr:last-child td { border-bottom: 0; }
.plan .wtable .r { text-align: right; font-variant-numeric: tabular-nums; }
.plan .wchart { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface); }
.plan .wdiagram { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--surface); overflow-x: auto; color: var(--fg); }
.plan .wdiagram svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.plan .wcap { margin: 0; font-size: .8rem; color: var(--muted); }
.plan .wimage { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.plan .wimage img { max-width: 100%; max-height: 480px; object-fit: contain; align-self: flex-start; height: auto; border: 1px solid var(--line); border-radius: 8px; }
.plan .wimage figcaption { font-size: .8rem; color: var(--muted); }
.plan .wembed { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: block; }
@media (max-width: 1000px) {
  .plan .lane { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .plan .lane .when { flex-direction: row; align-items: baseline; gap: 10px; padding: 0 0 4px; }
  .plan .arrow { flex-direction: row; justify-content: flex-start; align-items: center; gap: 10px; padding: 0 0 0 18px; }
  .plan .arrow i { order: -1; width: 2px; height: 18px; margin: 0 0 6px; flex: none; }
  .plan .arrow i::after { right: auto; left: -4px; top: auto; bottom: -6px; border: 5px solid transparent; border-top: 7px solid currentColor; border-bottom: 0; }
  .plan .arrow span { text-align: left; }
  .plan .two, .plan .goal { grid-template-columns: minmax(0, 1fr); }
  .plan .order { flex-direction: column; }
  .plan .stop, .plan .stop.now, .plan .stop.end { flex: none; padding: 0 0 18px 34px; }
  .plan .stop::before, .plan .stop:first-child::before, .plan .stop:last-child::before { left: 15px; right: auto; top: 0; bottom: 0; width: 2px; height: auto; }
  .plan .stop:last-child::before { bottom: auto; height: 10px; }
  .plan .stop::after { left: 8px; top: 2px; }
}
@media (max-width: 900px) {
  .plan .sec.needs { padding: 14px 12px; }
  .plan .stat { flex: 1; }
  .plan .row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .plan .row i { display: none; }
  .plan .folds .in { padding-left: 16px; }
}
/* A session's question for the owner */
.chip.q { background: var(--test); border-color: var(--test); color: var(--surface); font-weight: 600; }

  const idle = () => { const b = el("button", "more", "Archive all"); b.type = "button"; b.id = "archive-all"; b.addEventListener("click", sure); act.replaceChildren(b); return b; };
  const sure = () => {
    const list = (SHOWN[col] || []).slice();
    b0.msg.classList.remove("ok");
    if (!list.length) { colSay(col, "No cards here to archive."); return; }
    const text = "Archive all Deploy complete cards: " + list.map(c => "#" + (c.n ?? c.id)).join(", ");
    const yes = el("button", "more danger", "Archive all"), no = el("button", "more", "Cancel"); yes.type = no.type = "button";
    colSay(col, "");
    act.replaceChildren(el("span", "archq", "Archive all " + list.length + (list.length === 1 ? " card" : " cards") + " in " + col + "?"), yes, no);
    no.addEventListener("click", () => idle().focus());

}

/* filter:start */
// Search and filters. Kinds combine with AND; values picked within one kind combine with OR.
const NEEDS_ME = ["Plan review", "Human test", "Blocked"];
const qList = c => [].concat(c.question || []).filter(q => q && q.text);
// The Router records answers in the card's `answers`: [{q: <kind>, key, label, at}]. q may also be the question's text or its number.
function answerFor(c, q, i) {
  const hits = (Array.isArray(c.answers) ? c.answers : []).filter(a => a && a.key != null && a.q != null &&
    ((q.kind && String(a.q) === String(q.kind)) || String(a.q) === String(q.text) || String(a.q) === String(i + 1)));
  return hits.sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")))[0] || null;
}
const openQs = c => qList(c).filter((q, i) => !answerFor(c, q, i));
const hasQuestion = c => openQs(c).length > 0;
const repoOf = c => c.repo ? String(c.repo).split("/").pop() : "";
const testerOf = c => (c.agents && c.agents.tester) || "not run";
const sourceOf = c => c.source === "dsh" ? "Old board" : "Router";
const waitDays = (c, now) => NEEDS_ME.includes(c.column) && c.since ? Math.floor((now - Date.parse(c.since)) / 864e5) : -1;
const KINDS = [["repo", "Repo", repoOf], ["label", "Label", c => c.labels || []], ["tester", "Tester", testerOf], ["source", "From", sourceOf]];
const blankFilter = () => ({ q: "", repo: [], label: [], tester: [], source: [], needs: false, late: false });
// Returns 0 for no match, 1 for a match, 2 for a match found only in the status or next-step text.
function matches(c, F, now) {
  for (const [key, , get] of KINDS) {
    if (!F[key].length) continue;
    const have = [].concat(get(c));
    if (!have.some(v => F[key].includes(v))) return 0;
  }
  if (F.needs && !NEEDS_ME.includes(c.column) && !hasQuestion(c)) return 0;
  if (F.late && waitDays(c, now) < 3) return 0;
  const q = F.q.trim().toLowerCase(); if (!q) return 1;
  const low = a => a.map(x => x || "").join("\n").toLowerCase();
  const main = low([c.title, c.repo, (c.labels || []).join(" ")]), notes = low([c.status, c.next]), num = String(c.n ?? c.id ?? "");
  let rank = 1;
  for (const w of q.split(/\s+/)) {
    if (w[0] === "#" && w.length > 1) { if (!num.startsWith(w.slice(1))) return 0; continue; }
    if ((/^\d+$/.test(w) && num.startsWith(w)) || main.includes(w)) continue;
    if (w.length >= 3 && notes.includes(w)) { rank = 2; continue; }
    return 0;
  }
  return rank;
}
const activeCount = F => (F.q.trim() ? 1 : 0) + F.repo.length + F.label.length + F.tester.length + F.source.length + (F.needs ? 1 : 0) + (F.late ? 1 : 0);
/* filter:end */
let F = blankFilter();
try { const s = JSON.parse(localStorage.getItem("boardv2.filters") || "null"); if (s && typeof s === "object") { const b = blankFilter(); for (const k in b) if (typeof s[k] === typeof b[k] && Array.isArray(s[k]) === Array.isArray(b[k])) b[k] = s[k]; F = b; } } catch (e) {}
function keepFilters() { try { localStorage.setItem("boardv2.filters", JSON.stringify(F)); } catch (e) {} }
const WEAK = new Set(); // cards matched only in their status or next-step text; listed after the others
let chipSig = "";
function drawChips(cards) {
  const opts = KINDS.map(([key, word, get]) => { const set = new Set(F[key]); cards.forEach(c => [].concat(get(c)).forEach(v => { if (v) set.add(v); })); return [key, word, [...set].sort()]; });
  const sig = JSON.stringify([opts, F]); if (sig === chipSig) return; chipSig = sig;
  const box = $("chips"), had = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.chip : null;
  box.replaceChildren();
  const chip = (id, word, on, flip) => {
    const b = el("button", "fchip", word); b.type = "button"; b.dataset.chip = id; b.setAttribute("aria-pressed", String(!!on));
    b.addEventListener("click", () => { flip(); keepFilters(); repaint(); }); box.append(b);
  };
  chip("needs", "Needs me", F.needs, () => { F.needs = !F.needs; });
  chip("late", "Waiting 3+ days", F.late, () => { F.late = !F.late; });
  opts.forEach(([key, word, vals]) => {
    if (vals.length < 2 && !F[key].length) return;
    box.append(el("span", "fkind", word));
    vals.forEach(v => chip(key + ":" + v, v, F[key].includes(v), () => { F[key] = F[key].includes(v) ? F[key].filter(x => x !== v) : [...F[key], v]; }));
  });
  const n = activeCount(F), clear = $("clear");
  clear.textContent = n ? "Clear filters (" + n + ")" : "Clear filters"; clear.disabled = !n;
  if (had) { const again = [...box.children].find(x => x.dataset.chip === had); if (again) again.focus(); }
}
function render(cards) {
  LAST = cards; if (DRAG) return -1;
  const by = {}, total = {}; COLS.forEach(([name]) => { by[name] = []; total[name] = 0; });
  const on = activeCount(F) > 0, now = Date.now(); let shown = 0; WEAK.clear();
  cards.forEach(c => {
    if (PENDING[c.id] && colOf(c) !== PENDING[c.id].from) { clearTimeout(PENDING[c.id].timer); delete PENDING[c.id]; }
    const col = PENDING[c.id] ? PENDING[c.id].to : colOf(c);
    total[col]++; const rank = matches(c, F, now); if (rank) { by[col].push(c); shown++; if (rank === 2) WEAK.add(c.id); }
    if (V && V.c.id === c.id) liveRow(c);
  });
  for (const name in by) {
    // Ship it lists cards in shipping order (shipOrder, lowest first); cards without one go last.
    const order = c => name === "Ship it" && c.shipOrder != null && c.shipOrder !== "" && Number.isFinite(+c.shipOrder) ? +c.shipOrder : Infinity;
    const doneAt = c => name === "Done" ? String(c.doneAt || "") : "";
    by[name].sort((a, b) => (order(a) - order(b)) || WEAK.has(a.id) - WEAK.has(b.id) || doneAt(b).localeCompare(doneAt(a)) || String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")) || (b.n || 0) - (a.n || 0));
    boxes[name].n.textContent = on ? by[name].length + " of " + total[name] : total[name];
    SHOWN[name] = by[name];
    boxes[name].box.replaceChildren(...(by[name].length ? by[name].map(card) : [el("p", "empty", total[name] ? "No matches." : EMPTY[name] || "Empty.")]));
  }
  drawChips(cards);
  return shown;
}
let stampNow = null;
function repaint() { const shown = render(LAST); if (stampNow && shown >= 0) stampNow(shown, LAST.length); }
{
  const q = $("q"); q.value = F.q;
  q.addEventListener("input", () => { F.q = q.value; keepFilters(); repaint(); });
  q.addEventListener("keydown", e => { if (e.key === "Escape" && q.value) { e.stopPropagation(); q.value = ""; F.q = ""; keepFilters(); repaint(); } });
  $("clear").addEventListener("click", () => { F = blankFilter(); q.value = ""; keepFilters(); repaint(); q.focus(); });
  document.addEventListener("keydown", e => {
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey || $("veil") || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || "")) return;
    e.preventDefault(); q.focus(); q.select();
  });
}

function start(db) {
  const stamp = $("stamp"), note = $("note");
  DB = db;
  if (!db) { stamp.textContent = "Sign in to claude.ai to see the cards."; return; }
  const timer = setTimeout(() => { note.hidden = false; note.textContent = "The cards can't be reached yet. What you see may be out of date."; }, 10000);
  // Open cards load live, and so do the 300 most recently done cards (newest doneAt first, no age limit).
  let live = [], done = [];
  const paint = () => {
    const seen = new Set(), all = [];
    [...live, ...done].forEach(c => { if (!seen.has(c.id)) { seen.add(c.id); all.push(c); } });
    stampNow = (shown, n) => { stamp.textContent = (shown < n ? shown + " of " + n : n) + " cards · refreshed " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
    const shown = render(all); if (shown >= 0) stampNow(shown, all.length);
  };
  const rows = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const fail = e => { clearTimeout(timer); note.hidden = false; note.textContent = "The cards stopped updating (" + (e && e.code || "error") + "). Reopen the page to reconnect."; };
  db.collection("cards").where("column", "==", "Done").orderBy("doneAt", "desc").limit(300).onSnapshot(snap => { done = rows(snap); paint(); }, fail);
  db.collection("cards").where("column", "!=", "Done").limit(1000).onSnapshot(snap => {
    live = rows(snap); paint();
    if (!snap.metadata.fromCache) { clearTimeout(timer); note.hidden = true; }
  }, e => { clearTimeout(timer); note.hidden = false; note.textContent = "The cards stopped updating (" + (e && e.code || "error") + "). Reopen the page to reconnect."; });
}
render([]);
window.claude.use("db").then(start);
window.claude.use("comments").then(c => { CM = c; });
</script>
